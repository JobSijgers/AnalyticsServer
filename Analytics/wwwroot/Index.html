<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KHS Analytics</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<!-- Background Canvas -->
<canvas id="background-canvas"></canvas>

<!-- Login Container -->
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <h1 class="scrolling-gradient">KHS Analytics</h1>
            <p class="login-subtitle">Sign in to access the dashboard</p>
        </div>

        <form id="login-form" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                <span class="btn-text">Sign In</span>
            </button>
        </form>
    </div>
</div>

<!-- Scripts -->
<script src="js/ToastManager.js"></script>
<script src="js/TokenManager.js"></script>
<script src="js/Particles.js"></script>
<script src="js/Login.js"></script>
</body>
</html>
