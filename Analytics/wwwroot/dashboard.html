<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Selection - KnuckleHUB</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/projects-hub.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
<canvas id="background-canvas"></canvas>

<nav class="analytics-nav">
    <div class="nav-container">
        <div class="nav-brand">
            <h1 class="scrolling-gradient">KnuckleHUB</h1>
            <span class="nav-subtitle">Select Project</span>
        </div>
        <div class="nav-controls">
            <button id="logout-btn" class="control-btn logout">
                <span class="btn-icon">🚪</span>
                Logout
            </button>
        </div>
    </div>
</nav>

<main class="dashboard-container">
    <div class="hub-header">
    </div>

    <div id="loading-state" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading available projects...</p>
    </div>

    <div id="projects-grid" class="projects-grid hidden">
    </div>

    <div id="error-state" class="error-state hidden">
        <div class="error-icon">⚠️</div>
        <p id="error-message">Failed to load projects.</p>
        <button id="retry-btn" class="control-btn">Try Again</button>
    </div>
</main>

<script src="js/ToastManager.js"></script>
<script src="js/TokenManager.js"></script>
<script src="js/Particles.js"></script>
<script src="js/ProjectsHub.js"></script>
</body>
</html>d
